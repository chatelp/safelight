[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "safelight"
dynamic = ["version"]
description = "Safelight for Lightroom Classic: let Claude and other MCP clients work in your Lightroom Classic catalog."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chatelp" }]
keywords = ["lightroom-classic", "mcp", "photography", "claude"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/chatelp/safelight"
Issues = "https://github.com/chatelp/safelight/issues"

[project.scripts]
safelight = "safelight.cli:main"

[dependency-groups]
dev = [
  "cairosvg>=2.9.1",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/safelight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
